[package]
name = "poly-crypto"
description = "Polyphonia Cipher implementations (role 1)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
poly-core.workspace = true
sha2.workspace = true
rand.workspace = true
# Used by the real ciphers (role 1).
ml-kem = { workspace = true, features = ["zeroize"] }
# "sha2": rsa 0.9's own SHA-256 (sha2 0.10, the digest version rsa 0.9 uses) for OAEP.
rsa = { workspace = true, features = ["sha2"] }
aes-gcm = { workspace = true, features = ["zeroize"] }
hkdf.workspace = true
argon2 = { workspace = true, features = ["zeroize"] }
zeroize.workspace = true

[dev-dependencies]
poly-core = { workspace = true, features = ["test-utils"] }
proptest.workspace = true
